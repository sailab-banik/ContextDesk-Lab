services:
  backend:
    build: ./backend
    # Keys are passed in at runtime, never baked into the image. Without a .env
    # every component runs as a stub, as it does outside Docker.
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        # The browser, not the frontend container, calls the backend, so this
        # must be an address the host can reach.
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      # The backend's CORS policy admits http://localhost:3000 only.
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
