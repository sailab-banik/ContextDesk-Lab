[project]
name = "contextdesk-backend"
version = "0.1.0"
description = "ContextDesk Lab backend - context engineering playground for Redis Iris"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "langcache>=0.14.0",
    "openai>=3.14.0",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
    "redis-agent-memory>=0.4.0",
    "redis-context-retriever>=0.0.6",
]

# This is a deployed application, not a distributable library, so uv should not
# try to build or install it into the environment.
[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
